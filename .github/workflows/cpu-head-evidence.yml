name: Combined CPU evidence (fork only)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source commit to benchmark
        required: true
        type: string
      checkpoint:
        description: Checkpoint jobs to run
        type: choice
        default: all
        options: [all, english, multilingual, typed-decisions]
      phase:
        description: Measurements to run
        type: choice
        default: full
        options: [full, memory]

permissions:
  contents: read

jobs:
  benchmark:
    if: github.repository == 'bahram-po/laya'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        checkpoint: ${{ fromJSON(inputs.checkpoint == 'english' && '["english"]' || inputs.checkpoint == 'multilingual' && '["multilingual"]' || inputs.checkpoint == 'typed-decisions' && '["typed-decisions"]' || '["english","multilingual","typed-decisions"]') }}
    env:
      USE_TF: '0'
      USE_TORCH: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      FOCUSED_CASES: '--case triage/0 --case long/512 --case long/1024 --case long/2048 --case long/4096 --case options/1 --case options/32 --case batch/padded --case structured/mixed --case structured/batch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install the same core dependencies as upstream CI
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Record source and hardware
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source.txt
          lscpu > evidence/cpu.txt
          python -m pip freeze > evidence/packages.txt
      - name: Download the pinned public checkpoint
        env:
          CHECKPOINT_NAME: ${{ matrix.checkpoint }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from verify.checkpoints import fetch_entry, sha256
          manifest = json.loads(Path('verify/checkpoints.json').read_text())
          entry = next(e for e in manifest['checkpoints'] if e['name'] == os.environ['CHECKPOINT_NAME'])
          fetch_entry(entry, manifest['revision'], 'models')
          assert sha256(Path('models') / entry['path']) == entry['sha256']
          PY
      - name: Focused parity and paired public API latency
        if: inputs.phase != 'memory'
        run: python benchmarks/bench_cpu.py --checkpoint ${{ matrix.checkpoint }} --threads 2 $FOCUSED_CASES --json evidence/latency.json
      - name: Separate 33-option long-input suite
        if: inputs.phase != 'memory'
        run: python benchmarks/bench_cpu.py --checkpoint ${{ matrix.checkpoint }} --threads 2 --suite long-options --json evidence/long-options.json
      - name: Baseline peak RSS (fresh process)
        run: python benchmarks/bench_cpu.py --checkpoint ${{ matrix.checkpoint }} --threads 2 $FOCUSED_CASES --memory baseline --json evidence/memory-baseline.json
      - name: Combined peak RSS (fresh process)
        run: python benchmarks/bench_cpu.py --checkpoint ${{ matrix.checkpoint }} --threads 2 $FOCUSED_CASES --memory selected --json evidence/memory-selected.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cpu-combined-${{ matrix.checkpoint }}
          path: evidence/
          retention-days: 30
