name: CPU head compatibility (fork only)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source commit to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'bahram-po/laya'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    env:
      USE_TF: '0'
      USE_TORCH: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the upstream CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[mcp,serve,langchain]' httpx pytest
      - name: Test suites (same command as upstream CI)
        run: python scripts/test_suites.py
      - name: Chinese short-command benchmark tests
        run: python -m unittest discover -s research/benchmarks/zh_short_commands/tests -v
